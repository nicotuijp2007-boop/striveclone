<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Log workouts, build routines, track progress and time your rests." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS ignores SVG here and falls back to a letter, so it needs a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Liftlog" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Liftlog</title>
    <script>
      // Apply the theme chosen in Settings before the page paints, so it doesn't flash the other theme.
      try {
        var s = JSON.parse(localStorage.getItem("liftlog:v1") || "{}").settings || {};
        var t = s.theme, root = document.documentElement, bg;
        if (["light", "dark", "midnight", "forest", "sand"].indexOf(t) >= 0) root.dataset.theme = t;
        if (t === "custom" && s.customTheme) {
          // Only the main colours; the app sets the rest right after it loads.
          var c = s.customTheme, hex = /^#[0-9a-f]{6}$/i;
          root.dataset.theme = c.base === "light" ? "light" : "dark";
          if (hex.test(c.bg)) root.style.setProperty("--bg", (bg = c.bg));
          if (hex.test(c.surface)) root.style.setProperty("--surface", c.surface);
          if (hex.test(c.accent)) root.style.setProperty("--accent", c.accent);
        }
        bg = bg || { light: "#f3f4f6", dark: "#0b0c0f", midnight: "#080d1a", forest: "#0a100c", sand: "#f3ede3" }[root.dataset.theme];
        if (bg) document.querySelector('meta[name="theme-color"]').content = bg;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
